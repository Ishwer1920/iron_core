<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>We'll be back soon | IronCore Pharma</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --brand: #284c82;
        --brand-dark: #16273f;
        --brand-soft: #9db9de;
        --ink: #1a2433;
        --muted: #667282;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 16px;
        font-family: "Barlow", system-ui, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(1200px 600px at 50% -10%, #e9f0fa 0%, transparent 60%),
          linear-gradient(180deg, #f3f6fb 0%, #e6ecf6 100%);
      }
      .maint {
        width: 100%;
        max-width: 620px;
        text-align: center;
      }
      .maint__brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 36px;
      }
      .maint__brand img { height: 46px; width: auto; }
      .maint__brand strong {
        font-family: "Archivo", sans-serif;
        font-size: 24px;
        letter-spacing: 0.5px;
        color: var(--brand-dark);
        line-height: 1;
      }
      .maint__brand small {
        display: block;
        font-size: 12px;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--muted);
      }
      .maint__icon {
        width: 92px;
        height: 92px;
        margin: 0 auto 24px;
        color: var(--brand);
      }
      .maint h1 {
        font-family: "Archivo", sans-serif;
        font-weight: 900;
        font-size: clamp(38px, 8vw, 68px);
        line-height: 1.02;
        margin: 0 0 18px;
        color: var(--brand-dark);
      }
      .maint h1 span { color: var(--brand); }
      .maint p {
        font-size: clamp(16px, 2.6vw, 19px);
        line-height: 1.6;
        color: var(--muted);
        margin: 0 auto 10px;
        max-width: 480px;
      }
      .maint__rule {
        width: 70px;
        height: 4px;
        border-radius: 4px;
        background: var(--brand-soft);
        margin: 26px auto;
      }
      .maint__contact {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 26px;
        justify-content: center;
        margin-top: 8px;
        font-weight: 600;
      }
      .maint__contact a {
        color: var(--brand-ink, #21406b);
        text-decoration: none;
      }
      .maint__contact a:hover { text-decoration: underline; }
      .maint__admin {
        margin-top: 40px;
        font-size: 13px;
      }
      .maint__admin a { color: var(--muted); text-decoration: none; }
      .maint__admin a:hover { color: var(--brand); text-decoration: underline; }
    </style>
  </head>
  <body>
    <main class="maint">
      <div class="maint__brand">
        <img src="img/logo.svg" alt="" />
        <span>
          <strong>IronCore</strong>
          <small>Pharma</small>
        </span>
      </div>

      <svg class="maint__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.1-.6-.6-2.1 2.5-2.5z" />
      </svg>

      <h1>We'll be <span>back soon</span></h1>
      <p>Sorry, we're performing some scheduled maintenance at the moment. The site will be back up shortly — thanks for your patience.</p>

      <div class="maint__rule"></div>

      <p>Need to reach us in the meantime?</p>
      <div class="maint__contact">
        <a class="js-phone" hidden></a>
        <a href="mailto:info@ironcorehealth.com" class="js-email">info@ironcorehealth.com</a>
      </div>

      <p class="maint__admin"><a href="admin.html">Admin sign in</a></p>
    </main>
      <script src="js/contact.js?v=22"></script>
  </body>
</html>
